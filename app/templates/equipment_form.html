{% extends "base.html" %}{% block title %}{{ 'Edit' if item else 'Add' }} Equipment{% endblock %}{% block content %}
<div class="page-head"><div><h1>{{ 'Edit Equipment' if item else 'Add Equipment' }}</h1><p>Record a tool, machine or business asset.</p></div>{% if item %}<a class="button secondary" href="{{ url_for('equipment_detail',equipment_id=item.id) }}">Cancel</a>{% else %}<a class="button secondary" href="{{ url_for('equipment_list') }}">Cancel</a>{% endif %}</div>
<form method="post" enctype="multipart/form-data"><section class="panel"><div class="form-grid">
<label>Equipment ID<input name="equipment_no" value="{{ item.equipment_no if item else suggested_no }}" required></label><label>Name<input name="name" value="{{ item.name if item else '' }}" required></label>
<label>Category<select name="category"><option></option>{% for x in ['Hand Tools','Power Tools','Battery Tools','Diagnostic Equipment','Workshop Equipment','Hoists & Jacks','Air Tools','Welding Equipment','Measuring Tools','Toolboxes','Computers & Office','Safety Equipment','Other'] %}<option {% if item and item.category==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label>
<label>Brand<input name="brand" value="{{ item.brand if item else '' }}"></label><label>Model<input name="model" value="{{ item.model if item else '' }}"></label><label>Serial Number<input name="serial_number" value="{{ item.serial_number if item else '' }}"></label>
<label>Purchase Date<input type="date" name="purchase_date" value="{{ item.purchase_date if item else '' }}"></label><label>Purchase Price<input type="number" step="0.01" name="purchase_price" value="{{ item.purchase_price if item else 0 }}"></label><label>Current Value<input type="number" step="0.01" name="current_value" value="{{ item.current_value if item else 0 }}"></label>
<label>Supplier<input name="supplier" value="{{ item.supplier if item else '' }}"></label><label>Warranty Expiry<input type="date" name="warranty_expiry" value="{{ item.warranty_expiry if item else '' }}"></label><label>Location<input name="location" value="{{ item.location if item else '' }}" placeholder="Workshop Bay 2 / Shed 1"></label>
<label>Assigned To<input name="assigned_to" value="{{ item.assigned_to if item else '' }}" placeholder="Barry / Matt / Workshop"></label><label>Condition<select name="condition">{% for x in ['New','Excellent','Good','Fair','Needs Repair','Unserviceable','Retired'] %}<option {% if (item and item.condition==x) or (not item and x=='Good') %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><label>Status<select name="status">{% for x in ['Available','Checked Out','In Service','Needs Repair','Retired','Missing'] %}<option {% if (item and item.status==x) or (not item and x=='Available') %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label>
<label>Next Service<input type="date" name="next_service_date" value="{{ item.next_service_date if item else '' }}"></label><label>Calibration Due<input type="date" name="calibration_due" value="{{ item.calibration_due if item else '' }}"></label><label>Test & Tag Due<input type="date" name="test_tag_due" value="{{ item.test_tag_due if item else '' }}"></label>
<label>Photo<input type="file" name="photo" accept="image/*"></label><label>Receipt / Warranty<input type="file" name="receipt" accept="image/*,.pdf"></label><label class="wide">Notes<textarea name="notes" rows="5">{{ item.notes if item else '' }}</textarea></label>
</div><div class="form-actions"><button type="submit">Save Equipment</button></div></section></form>{% endblock %}
